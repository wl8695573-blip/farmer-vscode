<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-{{nonce}}'; script-src 'nonce-{{nonce}}';">
<title>农场主</title><style nonce="{{nonce}}">
*{box-sizing:border-box}body{margin:0;padding:28px;color:var(--vscode-foreground,#ccc);background:var(--vscode-editor-background,#1f1f1f);font:var(--vscode-font-size,13px)/1.6 var(--vscode-font-family,'Segoe UI',sans-serif)}main{max-width:740px;margin:auto}h1{font-size:24px;margin:0 0 8px}h2{font-size:16px;margin:0 0 14px}p{color:var(--vscode-descriptionForeground,#aaa);margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}section{border-top:1px solid var(--vscode-widget-border,#444);padding-top:18px}label{display:block;margin:14px 0 5px}.check{display:flex;gap:9px;align-items:center}select{width:100%;min-height:36px;padding:5px 8px;color:var(--vscode-dropdown-foreground,#ccc);background:var(--vscode-dropdown-background,#313131);border:1px solid var(--vscode-dropdown-border,#555);font:inherit}input[type=range]{width:100%;accent-color:var(--vscode-focusBorder,#0078d4)}input[type=checkbox]{accent-color:var(--vscode-focusBorder,#0078d4)}button{min-height:36px;border:1px solid var(--vscode-button-border,transparent);padding:7px 12px;font:inherit;color:var(--vscode-button-secondaryForeground,#ccc);background:var(--vscode-button-secondaryBackground,#333);cursor:pointer}button:hover{background:var(--vscode-button-secondaryHoverBackground,#444)}button.primary{background:var(--vscode-button-background,#0078d4);color:var(--vscode-button-foreground,#fff)}button.primary:hover{background:var(--vscode-button-hoverBackground,#026ec1)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--vscode-focusBorder,#0078d4);outline-offset:3px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 16px}#saved{align-self:center;color:var(--vscode-testing-iconPassed,#89d185)}#state{margin:14px 0 22px;font-size:12px}#guide{margin-top:12px}@media(max-width:580px){body{padding:20px 16px}.grid{grid-template-columns:1fr}}
</style></head><body><main><h1 data-t="name">农场主</h1><p data-t="subtitle"></p><div id="state" role="status" aria-live="polite"></div><div class="grid">
<section><h2 data-t="behavior"></h2><label class="check"><input id="enabled" type="checkbox"><span data-t="enabled"></span></label><label for="language" data-t="language"></label><select id="language"></select><label class="check"><input id="showComments" type="checkbox"><span data-t="showComments"></span></label><label class="check"><input id="reducedMotion" type="checkbox"><span data-t="reducedMotion"></span></label></section>
<section><h2 data-t="effects"></h2><label for="material" data-t="material"></label><select id="material"></select><label for="intensity" data-t="intensity"></label><select id="intensity"></select><label class="check"><input id="sound" type="checkbox"><span data-t="sound"></span></label><label for="volume" data-t="volume"></label><input id="volume" type="range" min="0" max="1" step="0.05"></section></div>
<div class="actions"><button class="primary" id="save" data-t="save"></button><button id="preview" data-t="preview"></button><span id="saved" role="status" aria-live="polite"></span></div><p id="guide" data-t="guide"></p></main><script nonce="{{nonce}}">
const vscode=acquireVsCodeApi(),$=id=>document.getElementById(id),keys=['enabled','language','showComments','reducedMotion','material','intensity','sound','volume'];let state,dirty=false;
function options(id,items){$(id).replaceChildren(...items.map(([value,text])=>{const node=document.createElement('option');node.value=value;node.textContent=text;return node;}));}
function render(s){state=s;const ui=s.ui;$('state').textContent=s.paused||!s.settings.enabled?ui.paused:s.ready?ui.watching:ui.offline;if(dirty)return;document.documentElement.lang=s.language;document.querySelectorAll('[data-t]').forEach(node=>node.textContent=ui[node.dataset.t]);options('language',[['auto',ui.auto],['zh-CN','简体中文'],['en','English'],['ja','日本語'],['ko','한국어'],['fr','Français'],['ru','Русский']]);options('material',[['leather',ui.leather],['braided',ui.braided],['rubber',ui.rubber]]);options('intensity',[['off',ui.off],['light',ui.light],['medium',ui.medium],['strong',ui.strong]]);for(const key of keys){const node=$(key);if(node.type==='checkbox')node.checked=s.settings[key];else node.value=s.settings[key];}}
for(const key of keys)$(key).addEventListener('input',()=>{dirty=true;$('saved').textContent='';});
window.addEventListener('message',event=>{if(event.data.type==='state')render(event.data);if(event.data.type==='saved'){dirty=false;render(state);$('saved').textContent=state.ui.saved;}});
$('save').addEventListener('click',()=>{const settings={};for(const key of keys){const node=$(key);settings[key]=node.type==='checkbox'?node.checked:node.type==='range'?Number(node.value):node.value;}vscode.postMessage({type:'save',settings});});
$('preview').addEventListener('click',()=>vscode.postMessage({type:'preview'}));vscode.postMessage({type:'ready'});
</script></body></html>
